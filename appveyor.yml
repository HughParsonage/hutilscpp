# DO NOT CHANGE the "init" and "install" sections below

image: Visual Studio 2022

# Download script file from GitHub
init:
  ps: |
        $ErrorActionPreference = "Stop"
        Invoke-WebRequest http://raw.github.com/krlmlr/r-appveyor/master/scripts/appveyor-tool.ps1 -OutFile "..\appveyor-tool.ps1"
        Import-Module '..\appveyor-tool.ps1'

install:
  ps: Bootstrap

cache:
  - C:\RLibrary

# Adapt as necessary starting from here

before_build:
  - ps: |
      # The legacy bootstrap installs Rtools40, which cannot build current R packages.
      $ErrorActionPreference = "Stop"
      Invoke-WebRequest https://github.com/r-hub/rtools45/releases/download/latest/rtools45.exe -OutFile "$env:TEMP\rtools45.exe"
      $installer = Start-Process -FilePath "$env:TEMP\rtools45.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
      if ($installer.ExitCode -ne 0) { throw "Rtools45 installation failed: $($installer.ExitCode)" }
      $env:PATH = "C:\rtools45\usr\bin;C:\rtools45\x86_64-w64-mingw32.static.posix\bin;" + $env:PATH
      gcc --version

build_script:
  - travis-tool.sh install_deps

test_script:
  - travis-tool.sh run_tests

on_failure:
  - 7z a failure.zip *.Rcheck\*
  - appveyor PushArtifact failure.zip

artifacts:
  - path: '*.Rcheck\**\*.log'
    name: Logs

  - path: '*.Rcheck\**\*.out'
    name: Logs

  - path: '*.Rcheck\**\*.fail'
    name: Logs

  - path: '*.Rcheck\**\*.Rout'
    name: Logs

  - path: '\*_*.tar.gz'
    name: Bits

  - path: '\*_*.zip'
    name: Bits
