name: Check
'on': push
jobs:
  build:
    name: covr
    runs-on: ubuntu-latest
    env:
      TT_AT_HOME: "TRUE"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Package Dependencies
        run: |-
          Rscript -e "install.packages(c('rcmdcheck', 'remotes', 'covr'), repos = 'https://cran.rstudio.com')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cran.rstudio.com')"
      - name: codecov
        run: Rscript -e "covr::codecov(quiet = FALSE)"
    container: rocker/verse:latest
  rcmdchecker:
    name: Rcmdcheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: any::rcmdcheck
        needs: check
    - uses: r-lib/actions/check-r-package@v2
  test-r-sanitizers:
    name: ASAN-UBSAN
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-hub/containers/gcc-asan:latest
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install packages
        shell: bash
        run: |
          R -q -e 'pak::pkg_install(c("deps::.", "tinytest"), dependencies = NA)'
          R CMD build .
          R CMD INSTALL --install-tests hutilscpp*.tar.gz
      - name: Run native safety and stress tests
        shell: Rscript {0}
        run: |
          files <- c("test-native-safety.R", "test-valgrind.R",
                     "test_character2integer.R", "test_Comma.R", "test-bminmax.R",
                     list.files("inst/tinytest", pattern = "^test-review-.*[.]R$"))
          for (file in files) {
            results <- tinytest::run_test_file(file.path("inst", "tinytest", file), at_home = TRUE)
            print(results)
            stopifnot(all(as.logical(results)))
          }
